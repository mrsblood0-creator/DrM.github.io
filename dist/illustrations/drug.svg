<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-label="From dose to biological response"><rect width="800" height="410" rx="24" fill="#edf4f2"/><style>text{font-family:Arial,sans-serif;fill:#173d45;font-size:16px}.label{font-size:14px}.small{font-size:12px}path,line,ellipse,circle,rect{stroke-linecap:round;stroke-linejoin:round}</style><text x="32" y="38" font-size="21" font-weight="bold">From dose to biological response</text><g fill="#fff" stroke="#9bb8c0" stroke-width="2"><rect x="35" y="145" width="155" height="100" rx="16"/><rect x="225" y="145" width="155" height="100" rx="16"/><rect x="415" y="145" width="155" height="100" rx="16"/><rect x="605" y="145" width="155" height="100" rx="16"/></g><g fill="#25817d" font-weight="bold"><text x="62" y="188">Exposure</text><text x="246" y="188">Distribution</text><text x="438" y="188">Target</text><text x="625" y="188">Response</text></g><text x="60" y="216" class="small">Absorbed drug</text><text x="246" y="216" class="small">Drug at tissue</text><text x="438" y="216" class="small">Binding / action</text><text x="625" y="216" class="small">Benefit or harm</text><path d="M195 195h24m165 0h24m165 0h24" stroke="#25817d" stroke-width="4"/><text x="105" y="304">Pharmacokinetics: concentration over time</text><text x="430" y="333">Pharmacodynamics: concentration → effect</text><text x="32" y="388" class="small">Exposure and target response both influence the observed effect • Simplified teaching schematic, not to scale</text></svg>